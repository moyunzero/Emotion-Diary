appId: com.moyunzero.emotiondiary
---
# 014 周回顾分享卡 Maestro 验收（含保存路径）
# 截图：.maestro/acceptance/014-shareable-ritual-cards/*.png
# 运行：yarn test:maestro:preflight && yarn start & yarn test:maestro:014
- launchApp
- runFlow:
    file: ../subflows/open-url.yaml
    env:
      URL: emotiondiary://review-export
- extendedWaitUntil:
    visible:
      id: share-card-canvas
    timeout: 30000
- takeScreenshot: .maestro/acceptance/014-shareable-ritual-cards/01-review-export-canvas
- extendedWaitUntil:
    visible:
      id: share-card-save-button
    timeout: 10000
- takeScreenshot: .maestro/acceptance/014-shareable-ritual-cards/02-review-export-save-button
- extendedWaitUntil:
    visible:
      id: share-card-snippet-toggle
    timeout: 5000
- assertNotVisible:
    id: share-card-snippet-input
- takeScreenshot: .maestro/acceptance/014-shareable-ritual-cards/03-review-export-snippet-default-off
# 保存路径（修复 PushNotificationIOS 崩溃后必须能走完）
- tapOn:
    id: share-card-save-button
- tapOn:
    text: "继续"
    optional: true
- tapOn:
    text: "允许访问所有照片"
    optional: true
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "好"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: share-card-canvas
    timeout: 15000
- takeScreenshot: .maestro/acceptance/014-shareable-ritual-cards/04-review-export-after-save
# Deep link 进入时无 back stack，返回应回首页而非 GO_BACK 报错
- tapOn:
    text: "返回"
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 15000
- takeScreenshot: .maestro/acceptance/014-shareable-ritual-cards/05-review-export-back-to-dashboard
