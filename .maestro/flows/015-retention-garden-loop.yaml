appId: com.moyunzero.emotiondiary
---
# 015 Phase 5 UAT 全场景验收（testID + 截图归档）
# 截图：.maestro/acceptance/015-retention-garden-loop/*.png
# 运行：yarn test:maestro:preflight && yarn start & yarn test:maestro:015

# ── UAT 1：Revisit Banner 中文花园副句 ──
- runFlow:
    file: ../subflows/seed-retention-touchpoints.yaml
    env:
      SCENARIO: revisit
      LOCALE: zh-Hans
      REMINDERS: default
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: revisit-banner-root
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: revisit-banner-subtitle
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: revisit-banner-action
    timeout: 5000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/01-revisit-banner-zh

# ── UAT 2：Revisit Banner English ──
- runFlow:
    file: ../subflows/seed-retention-touchpoints.yaml
    env:
      SCENARIO: revisit
      LOCALE: en-US
      REMINDERS: default
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 45000
