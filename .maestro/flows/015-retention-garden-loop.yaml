# ── UAT 5：Profile 提醒副文案 中文（默认关 + 开启后）──
- runFlow:
    file: ../subflows/seed-retention-touchpoints.yaml
    env:
      SCENARIO: revisit
      LOCALE: zh-Hans
      REMINDERS: default
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 45000
- tapOn:
    id: avatar
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: profile-retention-section
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: profile-daily-reminder-subtext
    timeout: 10000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/07-profile-retention-off-zh
- runFlow:
    file: ../subflows/apply-retention-seed.yaml
    env:
      SCENARIO: revisit
      LOCALE: zh-Hans
      REMINDERS: daily-on
- tapOn:
    id: avatar
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: profile-weekly-review-subtext
    direction: DOWN
    timeout: 20000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/08-profile-retention-on-zh

