- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/02-revisit-banner-en

# ── UAT 3：Weekly Review 中文分享卡桥接 ──
- runFlow:
    file: ../subflows/seed-retention-touchpoints.yaml
    env:
      SCENARIO: weekly
      LOCALE: zh-Hans
      REMINDERS: default
- extendedWaitUntil:
    visible:
      id: insights-screen
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: weekly-review-banner
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: weekly-review-banner-body
    timeout: 10000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/03-weekly-banner-zh
- tapOn:
    id: weekly-review-action
- extendedWaitUntil:
    visible:
      id: share-card-canvas
    timeout: 30000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/04-share-card-bridge-zh
- tapOn:
    id: review-export-back-button
- extendedWaitUntil:
    visible:
      id: insights-screen
    timeout: 15000

