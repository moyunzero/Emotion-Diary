# ── UAT 7：核心用户环 中文 record → dashboard → insights → export → revisit ──
- runFlow:
    file: ../subflows/seed-retention-touchpoints.yaml
    env:
      SCENARIO: weekly
      LOCALE: zh-Hans
      REMINDERS: default
- extendedWaitUntil:
    visible:
      id: insights-screen
    timeout: 45000
- runFlow:
    when:
      visible:
        id: onboarding-skip-button
    commands:
      - tapOn:
          id: onboarding-skip-button
- runFlow:
    file: ../subflows/open-url.yaml
    env:
      URL: emotiondiary://record
- extendedWaitUntil:
    visible:
      id: mood-content-input
    timeout: 45000
- tapOn:
    id: mood-content-input
- inputText: "Maestro 015 核心环 zh 记一笔"
- tapOn:
    id: mood-submit-button
- extendedWaitUntil:
    notVisible:
      id: mood-content-input
    timeout: 15000
- runFlow:
    file: ../subflows/open-url.yaml
    env:
      URL: emotiondiary://
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 30000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/11-core-loop-dashboard-zh
- runFlow:
    file: ../subflows/open-url.yaml
    env:
      URL: emotiondiary://insights
- extendedWaitUntil:
    visible:
      id: weekly-review-banner
    timeout: 30000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/12-core-loop-weekly-zh
- tapOn:
    id: weekly-review-action
- extendedWaitUntil:
    visible:
      id: share-card-canvas
    timeout: 30000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/13-core-loop-export-zh
- tapOn:
    id: review-export-back-button
- runFlow:
    file: ../subflows/seed-retention-touchpoints.yaml
    env:
      SCENARIO: revisit
      LOCALE: zh-Hans
      REMINDERS: default
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: revisit-banner-root
    timeout: 30000
- takeScreenshot: .maestro/acceptance/015-retention-garden-loop/14-core-loop-revisit-zh

