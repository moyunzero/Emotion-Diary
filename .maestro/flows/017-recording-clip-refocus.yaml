appId: com.moyunzero.emotiondiary
---
# 017 TEST-01 D-02 minimal: edit → create-tab clipHandler rebind (HYG-03 / D-09)
#
# Purpose: After editing an entry (edit modal AudioRecorder clipBinding), return to
# 「记一笔」and record again — clip must attach (tab-focus rebind path).
#
# Deferred (Phase 9 D-02 / Fragile): mid-arm abort races, pressOut timing interleavings
# — NOT covered by this flow; unit matrix only where pure-testable.
#
# Prerequisites:
#   - iOS Simulator booted + dev build com.moyunzero.emotiondiary installed
#   - Metro: yarn start (foreground or background)
#   - App locale zh-Hans (按住说话 / 编辑 / 保存修改 selectors)
#
# Run: yarn test:maestro:preflight && yarn test:maestro:017
# Screenshots: .maestro/acceptance/017-recording-clip-refocus/*.png

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-modal-root
    timeout: 90000
    optional: true
- runFlow:
    when:
      visible:
        id: onboarding-skip-button
    commands:
      - tapOn:
          id: onboarding-skip-button
- extendedWaitUntil:
    visible:
      id: mood-content-input
    timeout: 90000

# --- Clip 1: create tab (first entry with audio) ---
- runFlow:
    when:
      visible: "允许"
    commands:
      - tapOn: "允许"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- longPressOn:
    id: audio-record-button
- extendedWaitUntil:
    notVisible: "处理中..."
    timeout: 30000
- extendedWaitUntil:
    visible: "1 条"
    timeout: 30000
- takeScreenshot: .maestro/acceptance/017-recording-clip-refocus/01-create-first-clip
- tapOn:
    id: mood-submit-button
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 30000

# --- Dashboard: expand entry with audio → edit ---
- scrollUntilVisible:
    element:
      id: mood-entry-card
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 40
- tapOn:
    id: entry-card-pressable
    index: 0
- extendedWaitUntil:
    visible:
      id: entry-resolve-button
    timeout: 15000
- scrollUntilVisible:
    element:
      id: entry-edit-button
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: .maestro/acceptance/017-recording-clip-refocus/02-entry-expanded
- tapOn:
    id: entry-edit-button
- extendedWaitUntil:
    visible:
      id: mood-content-input
    timeout: 30000

# --- Clip 2: edit modal (compact RecordButton) ---
- scrollUntilVisible:
    element:
      id: audio-record-button
    direction: DOWN
    timeout: 20000
    centerElement: true
- longPressOn:
    id: audio-record-button
- extendedWaitUntil:
    notVisible: "处理中..."
    timeout: 30000
- extendedWaitUntil:
    visible: "2 条"
    timeout: 30000
- takeScreenshot: .maestro/acceptance/017-recording-clip-refocus/03-edit-second-clip
- scrollUntilVisible:
    element:
      id: mood-submit-button
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: mood-submit-button
- extendedWaitUntil:
    notVisible:
      id: mood-content-input
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 30000

# --- Core assertion: create tab rebind after edit closes ---
- tapOn:
    id: tab-record
- extendedWaitUntil:
    visible:
      id: audio-record-button
    timeout: 15000
- longPressOn:
    id: audio-record-button
- extendedWaitUntil:
    notVisible: "处理中..."
    timeout: 30000
- extendedWaitUntil:
    visible: "1 条"
    timeout: 30000
- takeScreenshot: .maestro/acceptance/017-recording-clip-refocus/04-create-tab-rebind-clip
