appId: com.moyunzero.emotiondiary
---
# 011 隐喻活化 Maestro 验收（含截图归档）
# 截图目录：.maestro/acceptance/011-metaphor/*.png
# 运行：yarn test:maestro:preflight && yarn start & yarn test:maestro:011
- runFlow:
    file: ../subflows/seed-active-entry.yaml
    env:
      ENTRY_CONTENT: "Maestro 011 和解仪式验收"
- takeScreenshot: acceptance/011-metaphor/01-dashboard-atmosphere
- tapOn:
    id: mood-entry-card
    index: 0
- extendedWaitUntil:
    visible:
      id: entry-resolve-button
    timeout: 10000
- takeScreenshot: acceptance/011-metaphor/02-entry-expanded-with-countdown
- tapOn:
    id: entry-resolve-button
# RN Alert 无 testID；和解确认已改为 resolve-confirm-* Overlay
- extendedWaitUntil:
    visible:
      id: resolve-confirm-root
    timeout: 8000
- takeScreenshot: acceptance/011-metaphor/02b-resolve-alert
- tapOn:
    id: resolve-confirm-confirm
- extendedWaitUntil:
    visible:
      id: resolve-ceremony-skip
    timeout: 10000
    optional: true
- takeScreenshot: acceptance/011-metaphor/03-resolve-ceremony
- runFlow:
    when:
      visible:
        id: resolve-ceremony-skip
    commands:
      - tapOn:
          id: resolve-ceremony-skip
- extendedWaitUntil:
    notVisible:
      id: resolve-ceremony-root
    timeout: 15000
- tapOn:
    id: dashboard-filter-button
- extendedWaitUntil:
    visible:
      id: dashboard-filter-resolved
    timeout: 5000
- tapOn:
    id: dashboard-filter-resolved
- extendedWaitUntil:
    visible:
      id: mood-entry-card
    timeout: 15000
- takeScreenshot: acceptance/011-metaphor/04-resolved-filter-list
- runFlow:
    file: ../subflows/open-url.yaml
    env:
      URL: emotiondiary://insights
- extendedWaitUntil:
    visible:
      id: insights-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: garden-ambience
    timeout: 15000
- takeScreenshot: acceptance/011-metaphor/05-insights-garden-ambience
# 焚烧仪式验收（CodeRabbit CR：burn-complete toast + RitualConfirmOverlay）
- runFlow:
    file: ../subflows/open-url.yaml
    env:
      URL: emotiondiary://record
- extendedWaitUntil:
    visible:
      id: mood-content-input
    timeout: 30000
- tapOn:
    id: mood-content-input
- inputText: "Maestro 011 焚烧仪式验收"
- tapOn:
    id: mood-submit-button
- extendedWaitUntil:
    notVisible:
      id: mood-content-input
    timeout: 15000
- runFlow:
    file: ../subflows/open-url.yaml
    env:
      URL: emotiondiary://
- extendedWaitUntil:
    visible:
      id: dashboard-header
    timeout: 30000
- tapOn:
    id: dashboard-filter-button
- extendedWaitUntil:
    visible:
      id: dashboard-filter-active
    timeout: 5000
- tapOn:
    id: dashboard-filter-active
- extendedWaitUntil:
    visible:
      id: mood-entry-card
    timeout: 15000
- tapOn:
    id: mood-entry-card
    index: 0
- extendedWaitUntil:
    visible:
      id: entry-burn-button
    timeout: 10000
- tapOn:
    id: entry-burn-button
- extendedWaitUntil:
    visible:
      id: burn-confirm-root
    timeout: 8000
- takeScreenshot: acceptance/011-metaphor/06-burn-confirm-overlay
- tapOn:
    id: burn-confirm-confirm
- extendedWaitUntil:
    visible:
      id: burn-complete-message
    timeout: 20000
- takeScreenshot: acceptance/011-metaphor/07-burn-complete-message
- extendedWaitUntil:
    notVisible:
      id: burn-complete-message
    timeout: 10000
- tapOn:
    id: dashboard-filter-button
- extendedWaitUntil:
    visible:
      id: dashboard-filter-burned
    timeout: 5000
- tapOn:
    id: dashboard-filter-burned
- extendedWaitUntil:
    visible:
      id: mood-entry-card
    timeout: 15000
- takeScreenshot: acceptance/011-metaphor/08-burned-filter-list
